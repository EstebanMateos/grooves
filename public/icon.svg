      <circle cx="346" cy="276" r="92" fill="none" stroke="#222A38" stroke-width="6"/>
      <circle cx="346" cy="276" r="74" fill="none" stroke="#1E2532" stroke-width="6"/>
      <circle cx="346" cy="276" r="56" fill="none" stroke="#1A2030" stroke-width="6"/>
