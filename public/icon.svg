<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Grooves icon">
  <defs>
    <linearGradient id="coverGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A44"/>
      <stop offset="100%" stop-color="#0F1526"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7D78A"/>
      <stop offset="100%" stop-color="#D4A84A"/>
    </linearGradient>

    <radialGradient id="vinylSheen" cx="40%" cy="35%" r="70%">
