    <circle cx="346" cy="276" r="48" fill="url(#labelGradient)"/>
    <circle cx="346" cy="276" r="14" fill="#F6F0E6"/>
    <circle cx="346" cy="276" r="6" fill="#1B1F2A"/>
  </g>

