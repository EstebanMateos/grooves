    <path d="M140 164 H176" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M140 198 H176" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <path d="M156 112 H314" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
